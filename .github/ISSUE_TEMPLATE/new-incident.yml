name: ️🔥 New incident
description: I noticed an outage and want to report it.
title: 🔥 New incident
labels: ['incident']
assignees:
  - steveoh
body:
  - type: markdown
    attributes:
      value: |
        For UGRC staff, when you are aware of a system incident, please fill out the following form.
        After submitting this incident, GitHub will create:

        1. a new markdown file in `/src/content/incident` with a UTC date generated automatically when you submit this form,

        Find your file in the new branch and explain the situation.
        When you're ready to publish, create a pull request.

        You do not need to enter or convert the incident date. When adding updates to the markdown file, use Utah local time with an explicit ISO 8601 offset: `-06:00` during MDT or `-07:00` during MST. As a rule of thumb, MDT is in effect from around March through early November, and MST from early November through March. For example, `2026-10-30T07:00:00-06:00` is 7:00 AM MDT. Daylight saving time changes on different dates each year, so use the offset that applies on the update date; dates and times are displayed in each visitor's local timezone.
  - type: input
    id: name
    attributes:
      label: Incident title
      description: What is the title of the incident? This will end up in the url so keep it short and to the point. This should be greater than 15 characters but less than 71 are preferred.
      placeholder: e.g. Network outage
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Incident description
      description: Describe the incident in detail and any resolution time frame that you may be aware of.
      placeholder: e.g. The TURN GPS network is having intermittent issues. We are meeting with Trimble to try to find a resolution.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Affected systems
      multiple: true
      description: What systems are having trouble?
      options:
        - ugrc api
        - turn gps
        - our website
        - discover base maps and imagery
        - open sgid
        - sgid on arcgis
        - license manager
        - mapserv
      default: 0
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Incident Severity
      multiple: false
      description: Please select the severity of the incident.
      options:
        - under-maintenance
        - degraded-performance
        - partial-outage
        - major-outage
      default: 3
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        > [!Tip]
        > 🙈🙈🙈 Please ignore everything below this line.
  - type: input
    id: type
    attributes:
      label: <!---->
      value: <!-- bot = {"type":"new-incident"} -->
    validations:
      required: true
